[project]
name = "garden"
version = "0.4.1"
description = "A folder format for agents: ranked goals in SEED.md, purpose and priority in NODE.md cards"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
garden = "garden.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
